name: Auf Strato veröffentlichen

# Lädt diesen Branch bei jedem Commit per SFTP nach www.w-esel.de/blattsingen.
# Dateien, die nur auf dem Server liegen (dienst/config.php, dienst/daten/), werden nie überschrieben oder gelöscht.
on:
  push:
    branches: [strato]
  workflow_dispatch:

jobs:
  hochladen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten prüfen
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          PASS: ${{ secrets.STRATO_PASS }}
        run: |
          [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$PASS" ] || { echo "::error::Secrets STRATO_HOST, STRATO_USER und STRATO_PASS fehlen (Settings › Secrets and variables › Actions)."; exit 1; }
      - name: Per SFTP hochladen
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          PASS: ${{ secrets.STRATO_PASS }}
          ZIEL: ${{ secrets.STRATO_PATH }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lftp
          ZIEL="${ZIEL:-/blattsingen}"
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; \
            mkdir -p -f $ZIEL; \
            mirror -R --verbose --no-perms \
              --exclude-glob .git* --exclude-glob .github/ --exclude-glob BRANCH.md \
              --exclude-glob dienst/config.php --exclude-glob dienst/daten/ \
              ./ $ZIEL; bye"
